name: Validate package
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: bash scripts/validate-package.sh
      - run: node --test tests/*.test.mjs
